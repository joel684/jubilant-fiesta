name: build-apk

# AURA TV BUILD
# Put this file in your repo at .github/workflows/build.yml (once).
# Then upload the Aura project as a .zip to the repo (phone: Add file -> Upload files).
# The newest zip is unpacked and built; the signed APK appears under the run's "Artifacts".
# No zip in the repo? Then the Aura project files in the repo itself (launcher/ at the top) are built.
#
# Aura is not a Gradle project: it is built with the Android SDK tools directly
# (aapt2 -> javac -> d8 -> zipalign -> apksigner), exactly like tools/build.ps1 does on a PC.
#
# One-time setup: add the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
# Without them the build still works, but with a throwaway key: installing an update then needs an
# uninstall first, and no release is published (Aura's in-app updater would not be able to install it).
# Run an older zip again: Actions -> build-apk -> Run workflow -> type the zip's file name.
#
# In-app updates: Aura checks the latest GitHub Release of the repo it was built from, and the build
# points it at THIS repo. The repo must be public for the TV to read it.

on:
  push:
    paths:
      - '**.zip'
      - '**.git'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      zip:
        description: 'Zip file to build (leave empty for the newest one)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  VERSION_PREFIX: '1.0'          # versionName becomes <prefix>.<build number>, e.g. 1.0.29612345
  MIN_SDK: '26'
  TARGET_SDK: '28'               # on purpose: from 29 Android only lets system apps change Wi-Fi (Control Center needs it)

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      WANTED: ${{ github.event.inputs.zip }}
      B64: ${{ secrets.KEYSTORE_BASE64 }}
      SP: ${{ secrets.KEYSTORE_PASSWORD }}
      KA: ${{ secrets.KEY_ALIAS }}
      KP: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the Aura project
        run: |
          set -e
          f="$WANTED"
          if [ -n "$f" ] && [ ! -f "$f" ]; then
            echo "::error::The zip '$f' is not in the repo"
            exit 1
          fi
          if [ -z "$f" ]; then
            f=$(git log --name-only --diff-filter=AM --pretty=format: -- '*.zip' '*.git' | sed '/^$/d' | head -1)
          fi
          rm -rf project
          mkdir project
          if [ -n "$f" ] && [ -f "$f" ]; t
